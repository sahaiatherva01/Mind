version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mind_user
      POSTGRES_PASSWORD: mind_password
      POSTGRES_DB: mind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mind_user -d mind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mind_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: mind_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: mind_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://mind_user:mind_password@postgres:5432/mind_db
      - REDIS_URL=redis://redis:6379/0
      - EMAIL_BACKEND=mailpit
      - MAILPIT_HOST=mailpit
      - MAILPIT_PORT=1025
      - AI_PROVIDER=mock
      - ENVIRONMENT=development
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./ai_engine:/app/ai_engine
      - ./database:/app/database
      - local_storage:/app/local_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: mind_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  local_storage:

