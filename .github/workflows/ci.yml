name: Mind CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mind_ci_user
          POSTGRES_PASSWORD: mind_ci_password
          POSTGRES_DB: mind_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest pytest-asyncio httpx

      - name: Lint with Ruff
        run: |
          ruff check backend ai_engine

      - name: Check Alembic Migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://mind_ci_user:mind_ci_password@localhost:5432/mind_ci_db
        run: |
          alembic upgrade head

      - name: Run Backend Tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://mind_ci_user:mind_ci_password@localhost:5432/mind_ci_db
          DATABASE_URL: postgresql+asyncpg://mind_ci_user:mind_ci_password@localhost:5432/mind_ci_db
          REDIS_URL: redis://localhost:6379/0
          AI_PROVIDER: mock
          EMAIL_BACKEND: console
          ENVIRONMENT: test
        run: |
          pytest backend/tests -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Type check
        working-directory: frontend
        run: npm run build

